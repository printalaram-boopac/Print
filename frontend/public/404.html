<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PrintAlarm</title>
    <script>
      // GitHub Pages SPA redirect: stash the intended path and bounce to index.html,
      // which restores it via the matching script in index.html.
      var pathSegmentsToKeep = 1; // keep "/printalarm"
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
